name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble static site with clean URLs
        run: |
          set -e
          SRC=personal-website
          rm -rf site
          mkdir -p site

          # Shared assets at the root.
          cp -r "$SRC/assets" site/assets

          # Copy shared report assets (served from site root).
          cp public/reports/chart-download.js site/
          cp public/reports/chart-download.css site/

          # Copy research brief reports with all dependencies.
          cp -r public/reports/nlp-textual-analysis site/
          cp -r public/reports/ai-digital-transformation site/
          cp -r public/reports/blockchain-crypto site/
          cp -r public/reports/cybersecurity-risk-disclosure site/
          cp -r public/reports/nz-tourism-nowcasting site/
          cp -r public/reports/ai-tokens-future-asset site/
          cp -r public/reports/understanding-llms-accounting site/
          cp -r public/reports/ai-era-daily-life site/
          cp -r public/reports/prompt-literacy-ai-era site/
          cp -r public/reports/accounting-finance-research-ai-era site/
          cp -r public/reports/auckland-property-without-mortgage site/

          # Copy downloadable data files.
          mkdir -p site/data
          cp public/data/*.csv site/data/ 2>/dev/null || true
          cp public/data/*.txt site/data/ 2>/dev/null || true
          cp public/data/*.py  site/data/ 2>/dev/null || true

          # Rewrite relative links into clean absolute URLs.
          # ../pages/<name>.html  -> /<name>/   (index.html -> /)
          # ../assets/            -> /assets/
          rewrite() {
            sed \
              -e 's|\.\./pages/index\.html|/|g' \
              -e 's|\.\./pages/research\.html|/research/|g' \
              -e 's|\.\./pages/data-code\.html|/data-code/|g' \
              -e 's|\.\./pages/insights\.html|/insights/|g' \
              -e 's|\.\./pages/article\.html|/article/|g' \
              -e 's|\.\./pages/contact\.html|/contact/|g' \
              -e 's|\.\./pages/property-scout\.html|/property-scout/|g' \
              -e 's|\.\./assets/|/assets/|g' \
              "$1"
          }

          # Home page at the root.
          rewrite "$SRC/pages/index.html" > site/index.html

          # Section pages as /<name>/index.html for clean URLs.
          for name in research data-code insights article contact; do
            mkdir -p "site/$name"
            rewrite "$SRC/pages/$name.html" > "site/$name/index.html"
          done

          # Property Scout: write the authored landing page first, then place the
          # generated app tree underneath it. public/property-scout/app is produced
          # by the research publisher and is never hand-edited; the landing
          # index.html must win over anything copied into the same directory.
          mkdir -p site/property-scout
          rewrite "$SRC/pages/property-scout.html" > site/property-scout/index.html
          if [ -d public/property-scout/app ]; then
            cp -r public/property-scout/app site/property-scout/app
          fi

          # 404 falls back to the home page.
          cat > site/404.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=/">
            <title>Not found</title>
          </head>
          <body>
            <p>Page not found. <a href="/">Return home</a>.</p>
          </body>
          </html>
          HTML

          # Preserve the custom domain.
          if [ -f public/CNAME ]; then
            cp public/CNAME site/CNAME
          fi

          # Serve files as-is (no Jekyll processing).
          touch site/.nojekyll

          echo "Assembled site:"
          find site -maxdepth 2 -type f | sort

          echo "Property Scout:"
          if [ -d site/property-scout/app ]; then
            find site/property-scout/app -maxdepth 1 -type f | sort
            echo "  data files: $(find site/property-scout/app/data -maxdepth 1 -type f | wc -l | tr -d ' ')"
          else
            echo "  app/ not present yet (landing page only)"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
